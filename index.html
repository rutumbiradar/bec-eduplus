<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEC EduPlus</title>

    <style>
       <link rel="stylesheet" href="css/style.css">
    </style>
</head>

<body>

<header>
    <h1>BEC EduPlus</h1>
    <p>Integrated Engineering College Management System</p>
</header>

<div class="container">

    <h2>Welcome to BEC EduPlus</h2>

    <p>
        Academic • Administration • Examination • NBA • NAAC • Research
    </p>

    <div class="login-box">

        <h3>Login</h3>

        <select id="role">
            <option value="">Select Login Type</option>
            <option value="admin">Administrator</option>
            <option value="principal">Principal</option>
            <option value="hod">HOD</option>
            <option value="faculty">Faculty</option>
            <option value="student">Student</option>
        </select>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

    </div>

</div>

<footer>
    © 2026 BEC EduPlus | Engineering College ERP
</footer>

<script>

function login() {

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (role === "" || username === "" || password === "") {

        alert("Please enter all login details.");

        return;
    }

    alert("Login system will be connected to the database in the next stage.");

}

</script>

</body>
</html>
