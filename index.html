<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEC EduPlus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .container h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .container p {
            color: #555;
            margin-bottom: 30px;
        }

        .login-box {
            background: white;
            max-width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-box h3 {
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2f52;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #123c69;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>BEC EduPlus</h1>
    <p>Integrated Engineering College Management System</p>
</header>

<div class="container">

    <h2>Welcome to BEC EduPlus</h2>

    <p>
        Academic • Administration • Examination • NBA • NAAC • Research
    </p>

    <div class="login-box">

        <h3>Login</h3>

        <select id="role">
            <option value="">Select Login Type</option>
            <option value="admin">Administrator</option>
            <option value="principal">Principal</option>
            <option value="hod">HOD</option>
            <option value="faculty">Faculty</option>
            <option value="student">Student</option>
        </select>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

    </div>

</div>

<footer>
    © 2026 BEC EduPlus | Engineering College ERP
</footer>

<script>

function login() {

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (role === "" || username === "" || password === "") {

        alert("Please enter all login details.");

        return;
    }

    alert("Login system will be connected to the database in the next stage.");

}

</script>

</body>
</html>
