<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEC EduPlus</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
    <h1>BEC EduPlus</h1>
    <p>Integrated Engineering College Management System</p>
</header>

<div class="container">

    <h2>Welcome to BEC EduPlus</h2>

    <p>
        Academic • Administration • Examination • NBA • NAAC • Research
    </p>

    <div class="login-box">

        <h3>Login</h3>

        <select id="role">
            <option value="">Select Login Type</option>
            <option value="admin">Administrator</option>
            <option value="principal">Principal</option>
            <option value="hod">HOD</option>
            <option value="faculty">Faculty</option>
            <option value="student">Student</option>
        </select>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button type="button" id="loginButton">Login</button>

    </div>

</div>

<footer>
    © 2026 BEC EduPlus | Engineering College ERP
</footer>

<script>

<script src="js/script.js"></script>
</script>

</body>
</html>
