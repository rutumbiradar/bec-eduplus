<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEC EduPlus - Faculty</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #1e293b;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            font-size: 24px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .search-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0f172a;
            color: white;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        .save-btn {
            margin-top: 20px;
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media(max-width: 600px) {

            .container {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>
        <i class="fas fa-chalkboard-teacher"></i>
        BEC EduPlus
    </h1>

    <p>Faculty Management System</p>

</header>


<div class="container">

    <div class="top-section">

        <h2>Faculty</h2>

        <button class="add-btn" onclick="openModal()">

            <i class="fas fa-plus"></i>
            Add Faculty

        </button>

    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Faculty ID, Name, Department, Designation..."
            onkeyup="displayFaculty()"
        >

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Faculty ID</th>
                    <th>Faculty Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Qualification</th>
                    <th>Specialization</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="facultyTableBody"></tbody>

        </table>

    </div>

</div>


<!-- FACULTY MODAL -->

<div class="modal" id="facultyModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Faculty
            </h2>

            <span
                class="close"
                onclick="closeModal()">
                &times;
            </span>

        </div>


        <form id="facultyForm">

            <div class="form-grid">


                <div class="form-group">

                    <label>Faculty ID</label>

                    <input
                        type="text"
                        id="facultyId"
                        required>

                </div>


                <div class="form-group">

                    <label>Faculty Name</label>

                    <input
                        type="text"
                        id="facultyName"
                        required>

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <select
                        id="department"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        <option>Mathematics</option>
                        <option>CSE</option>
                        <option>ISE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                        <option>AI & ML</option>
                        <option>Biotechnology</option>
                        <option>Industrial Engineering</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Designation</label>

                    <select
                        id="designation"
                        required>

                        <option value="">
                            Select Designation
                        </option>

                        <option>Professor</option>
                        <option>Associate Professor</option>
                        <option>Assistant Professor</option>
                        <option>Visiting Faculty</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Qualification</label>

                    <input
                        type="text"
                        id="qualification"
                        placeholder="Example: M.Tech, Ph.D."
                        required>

                </div>


                <div class="form-group">

                    <label>Specialization</label>

                    <input
                        type="text"
                        id="specialization"
                        placeholder="Example: Mathematics">

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email">

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        id="phone">

                </div>


            </div>


            <button
                class="save-btn"
                type="submit">

                <i class="fas fa-save"></i>
                Save Faculty

            </button>

        </form>

    </div>

</div>


<script>

let faculty =
    JSON.parse(
        localStorage.getItem("eduplusFaculty")
    ) || [];


let editIndex = -1;


// DISPLAY FACULTY

function displayFaculty() {

    const tbody =
        document.getElementById(
            "facultyTableBody"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();


    tbody.innerHTML = "";


    const filteredFaculty =
        faculty.filter(person =>

            person.facultyId
                .toLowerCase()
                .includes(search) ||

            person.name
                .toLowerCase()
                .includes(search) ||

            person.department
                .toLowerCase()
                .includes(search) ||

            person.designation
                .toLowerCase()
                .includes(search)

        );


    if (filteredFaculty.length === 0) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    No faculty found.

                </td>

            </tr>

        `;

        return;
    }


    filteredFaculty.forEach(person => {

        const realIndex =
            faculty.indexOf(person);


        tbody.innerHTML += `

            <tr>

                <td>${person.facultyId}</td>

                <td>${person.name}</td>

                <td>${person.department}</td>

                <td>${person.designation}</td>

                <td>${person.qualification}</td>

                <td>${person.specialization}</td>

                <td>${person.email}</td>

                <td>${person.phone}</td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editFaculty(${realIndex})">

                        <i class="fas fa-edit"></i>

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteFaculty(${realIndex})">

                        <i class="fas fa-trash"></i>

                    </button>

                </td>

            </tr>

        `;

    });

}


// OPEN MODAL

function openModal() {

    editIndex = -1;

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Faculty";


    document.getElementById(
        "facultyForm"
    ).reset();


    document.getElementById(
        "facultyModal"
    ).style.display = "flex";

}


// CLOSE MODAL

function closeModal() {

    document.getElementById(
        "facultyModal"
    ).style.display = "none";

}


// SAVE FACULTY

document.getElementById(
    "facultyForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const person = {

            facultyId:
                document.getElementById(
                    "facultyId"
                ).value.trim(),

            name:
                document.getElementById(
                    "facultyName"
                ).value.trim(),

            department:
                document.getElementById(
                    "department"
                ).value,

            designation:
                document.getElementById(
                    "designation"
                ).value,

            qualification:
                document.getElementById(
                    "qualification"
                ).value.trim(),

            specialization:
                document.getElementById(
                    "specialization"
                ).value.trim(),

            email:
                document.getElementById(
                    "email"
                ).value.trim(),

            phone:
                document.getElementById(
                    "phone"
                ).value.trim()

        };


        if (editIndex === -1) {

            faculty.push(person);

        } else {

            faculty[editIndex] = person;

        }


        localStorage.setItem(
            "eduplusFaculty",
            JSON.stringify(faculty)
        );


        closeModal();

        displayFaculty();

    }
);


// EDIT FACULTY

function editFaculty(index) {

    const person =
        faculty[index];


    editIndex = index;


    document.getElementById(
        "modalTitle"
    ).textContent = "Edit Faculty";


    document.getElementById(
        "facultyId"
    ).value =
        person.facultyId;


    document.getElementById(
        "facultyName"
    ).value =
        person.name;


    document.getElementById(
        "department"
    ).value =
        person.department;


    document.getElementById(
        "designation"
    ).value =
        person.designation;


    document.getElementById(
        "qualification"
    ).value =
        person.qualification;


    document.getElementById(
        "specialization"
    ).value =
        person.specialization;


    document.getElementById(
        "email"
    ).value =
        person.email;


    document.getElementById(
        "phone"
    ).value =
        person.phone;


    document.getElementById(
        "facultyModal"
    ).style.display =
        "flex";

}


// DELETE FACULTY

function deleteFaculty(index) {

    if (
        confirm(
            "Are you sure you want to delete this faculty?"
        )
    ) {

        faculty.splice(index, 1);


        localStorage.setItem(
            "eduplusFaculty",
            JSON.stringify(faculty)
        );


        displayFaculty();

    }

}


// INITIAL DISPLAY

displayFaculty();

</script>

</body>
</html>
