<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEC EduPlus - Students</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #1e293b;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .container {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            font-size: 24px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .search-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0f172a;
            color: white;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 650px;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        .save-btn {
            margin-top: 20px;
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .container {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1><i class="fas fa-user-graduate"></i> BEC EduPlus</h1>
    <p>Student Management System</p>
</header>

<div class="container">

    <div class="top-section">
        <h2>Students</h2>

        <button class="add-btn" onclick="openModal()">
            <i class="fas fa-plus"></i> Add Student
        </button>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search by Roll No, USN, Name, Department..."
            onkeyup="displayStudents()"
        >
    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>USN</th>
                    <th>Student Name</th>
                    <th>Department</th>
                    <th>Semester</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTableBody"></tbody>

        </table>

    </div>

</div>


<!-- ADD / EDIT STUDENT MODAL -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Add Student</h2>

            <span class="close" onclick="closeModal()">
                &times;
            </span>

        </div>

        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="rollNo" required>
                </div>

                <div class="form-group">
                    <label>USN</label>
                    <input type="text" id="usn" required>
                </div>

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName" required>
                </div>

                <div class="form-group">
                    <label>Department</label>

                    <select id="department" required>

                        <option value="">Select Department</option>

                        <option>CSE</option>
                        <option>ISE</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>ME</option>
                        <option>Civil</option>
                        <option>AI</option>
                        <option>BT</option>
                        <option>IP</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Semester</label>

                    <select id="semester" required>

                        <option value="">Select Semester</option>

                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input type="email" id="email">

                </div>

                <div class="form-group">

                    <label>Phone</label>

                    <input type="text" id="phone">

                </div>

            </div>

            <button class="save-btn" type="submit">
                <i class="fas fa-save"></i> Save Student
            </button>

        </form>

    </div>

</div>


<script>

let students = JSON.parse(
    localStorage.getItem("eduplusStudents")
) || [];

let editIndex = -1;


// Display students

function displayStudents() {

    const tbody =
        document.getElementById("studentTableBody");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    tbody.innerHTML = "";

    const filteredStudents = students.filter(student =>

        student.rollNo.toLowerCase().includes(search) ||
        student.usn.toLowerCase().includes(search) ||
        student.name.toLowerCase().includes(search) ||
        student.department.toLowerCase().includes(search)

    );

    if (filteredStudents.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No students found.
                </td>
            </tr>
        `;

        return;
    }

    filteredStudents.forEach((student) => {

        const realIndex = students.indexOf(student);

        tbody.innerHTML += `

            <tr>

                <td>${student.rollNo}</td>

                <td>${student.usn}</td>

                <td>${student.name}</td>

                <td>${student.department}</td>

                <td>${student.semester}</td>

                <td>${student.email}</td>

                <td>${student.phone}</td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editStudent(${realIndex})">

                        <i class="fas fa-edit"></i>

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${realIndex})">

                        <i class="fas fa-trash"></i>

                    </button>

                </td>

            </tr>

        `;

    });

}


// Open modal

function openModal() {

    editIndex = -1;

    document.getElementById("modalTitle").textContent =
        "Add Student";

    document.getElementById("studentForm").reset();

    document.getElementById("studentModal").style.display =
        "flex";
}


// Close modal

function closeModal() {

    document.getElementById("studentModal").style.display =
        "none";
}


// Save student

document.getElementById("studentForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const student = {

        rollNo:
            document.getElementById("rollNo").value.trim(),

        usn:
            document.getElementById("usn").value.trim(),

        name:
            document.getElementById("studentName").value.trim(),

        department:
            document.getElementById("department").value,

        semester:
            document.getElementById("semester").value,

        email:
            document.getElementById("email").value.trim(),

        phone:
            document.getElementById("phone").value.trim()

    };


    if (editIndex === -1) {

        students.push(student);

    } else {

        students[editIndex] = student;

    }


    localStorage.setItem(
        "eduplusStudents",
        JSON.stringify(students)
    );

    closeModal();

    displayStudents();

});


// Edit student

function editStudent(index) {

    const student = students[index];

    editIndex = index;

    document.getElementById("modalTitle").textContent =
        "Edit Student";

    document.getElementById("rollNo").value =
        student.rollNo;

    document.getElementById("usn").value =
        student.usn;

    document.getElementById("studentName").value =
        student.name;

    document.getElementById("department").value =
        student.department;

    document.getElementById("semester").value =
        student.semester;

    document.getElementById("email").value =
        student.email;

    document.getElementById("phone").value =
        student.phone;

    document.getElementById("studentModal").style.display =
        "flex";
}


// Delete student

function deleteStudent(index) {

    if (
        confirm(
            "Are you sure you want to delete this student?"
        )
    ) {

        students.splice(index, 1);

        localStorage.setItem(
            "eduplusStudents",
            JSON.stringify(students)
        );

        displayStudents();

    }

}


// Initial display

displayStudents();

</script>

</body>
</html>
